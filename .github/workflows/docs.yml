name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - docs/**
      - scripts/finalize-docs.py
      - tests/check-built-docs.py
      - tests/check-docs.sh
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the documentation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.24"

      - name: Install Moat
        run: go install github.com/oddship/moat@v0.6.2

      - name: Build and validate the site
        run: |
          moat build docs/ _site/
          python3 scripts/finalize-docs.py \
            _site/ \
            https://oddship.github.io/logchef-nix
          python3 tests/check-built-docs.py \
            _site/ \
            /logchef-nix \
            https://oddship.github.io/logchef-nix

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
