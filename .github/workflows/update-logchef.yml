name: Update Logchef

on:
  schedule:
    # GitHub cannot subscribe this repository to another repository's release
    # event, so check the upstream stable release once per day.
    - cron: "17 05 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: logchef-upstream-update
  cancel-in-progress: false

jobs:
  update:
    name: Refresh the pinned Logchef release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          enable_kvm: true

      - name: Check the latest stable upstream release
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Logchef publishes server and CLI releases from the same repository.
          # The GitHub `releases/latest` endpoint can therefore return a CLI tag
          # (for example, `cli-v0.2.2`) instead of the latest server release.
          latest_tag="$(
            gh api --paginate \
              'repos/mr-karan/logchef/releases?per_page=100' \
              | jq -r -s '
                  flatten
                  | map(select(
                      .draft == false
                      and .prerelease == false
                      and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                    ))
                  | sort_by(.published_at)
                  | reverse
                  | .[0].tag_name // empty
                '
          )"

          if [[ -z "$latest_tag" ]]; then
            echo "No stable Logchef server release was found." >&2
            exit 1
          fi

          if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream server release tag: $latest_tag" >&2
            exit 1
          fi

          current_version="$(sed -nE 's/^[[:space:]]*version = "([^"]+)";/\1/p' package.nix | head -n1)"
          latest_version="${latest_tag#v}"

          if [[ "$current_version" == "$latest_version" ]]; then
            needs_update=false
            status_message="Logchef is already pinned to $latest_tag."
          else
            needs_update=true
            status_message="Updating Logchef $current_version -> $latest_version."
          fi

          {
            echo "tag=$latest_tag"
            echo "version=$latest_version"
            echo "needs_update=$needs_update"
          } >> "$GITHUB_OUTPUT"

          echo "$status_message"

      - name: Refresh source and dependency hashes
        if: steps.upstream.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: nix develop --command bash ./update.sh "$VERSION"

      - name: Run the release checks
        if: steps.upstream.outputs.needs_update == 'true'
        run: |
          nix fmt -- --ci
          nix flake check --all-systems --no-build
          nix build \
            .#checks.x86_64-linux.package \
            .#checks.x86_64-linux.moduleEvaluation \
            .#checks.x86_64-linux.vm \
            -L --no-link
          nix run nixpkgs#actionlint

      - name: Commit the update branch
        if: steps.upstream.outputs.needs_update == 'true'
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          set -euo pipefail

          branch="automation/logchef-${VERSION}"
          git checkout -B "$branch"
          git add -A

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The updater produced no changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(logchef): update to v${VERSION}"
          gh auth setup-git
          git push --force-with-lease origin "$branch"

          {
            echo "changed=true"
            echo "branch=$branch"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the release-check status
        if: steps.branch.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.branch.outputs.sha }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=success \
            -f context='Update Logchef / release checks' \
            -f description='Pinned update passed formatting, evaluation, build, and VM checks.' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Open or reuse the update pull request
        if: steps.branch.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
          VERSION: ${{ steps.upstream.outputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          open_prs="$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')"
          if [[ "$open_prs" == "0" ]]; then
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "chore(logchef): update to v${VERSION}" \
              --body "## Summary

              Updates the pinned Logchef source release and fixed dependency hashes to v${VERSION}.

              ## Verification

              - Formatting, all-system evaluation, package builds, VM tests, and actionlint passed in the updater workflow.
              - The source, Go vendor tree, and Bun dependency tree remain hash-pinned.
              - Review upstream release notes and migrations before merging."
          else
            echo "An open update PR already exists for $BRANCH."
          fi
